[package]
name = "synclock"
version = "0.3.0"
description = "Sync time entries from Early/Toggl to Jira worklogs or YouTrack work items"
authors = ["Tadeáš Kulhánek"]
edition = "2021"

[lib]
name = "synclock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
dotenvy = "0.15"
dirs = "6"
regex-lite = "0.1"
chrono = "0.4"
